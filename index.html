<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Nada Suspeito Confia</title>
</head>
<body>
  <div class="scene">
    <div class="bg"></div>
      <div class="center">
        <button class="btn" id="openBtn"><p class="textBtn">Não aperte</p></button>
      </div>
    <img class="corner-gif" src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExbDJza2hrc3loOTQ5aG9lcW40emZua25zbWYwemtwNjVhZWwwaHR1MSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/PQHZH0iHMCmrNhRcE9/giphy.gif" alt="" />
    </div>

    <div class="overlay" id="overlay">
      <div class="overlay-content">

        <div class="birthday-text">
          <p class="feliz">Feliz Aniversário</p>
          <p class="nome">Matheus<span>!</span></p>
        </div>

        <div class="msg">
          Parabéns por mais um ano de vida mano!<br>
          Finje que eu nunca esqueci nada, e aceite o presente :D 
        </div>

        <div class="ticket-wrap">
          <img class="ticket-img" id="ticketThumb" src="https://i.ibb.co/tpYQXz3g/voucher-anivers-rio.png" alt="Voucher de aniversário" />
          <p class="ticket-hint">clique para ampliar</p>
        </div>

        <button class="close-btn" id="closeBtn">fechar</button>
      </div>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <img src="https://i.ibb.co/tpYQXz3g/voucher-anivers-rio.png" alt="Voucher ampliado" class="lightbox-img" />
  </div>

  <!-- Áudios -->
  <audio id="bgMusic" loop>
    <source src="pain-2.mp3" type="audio/mpeg">
  </audio>
  <audio id="clickSound" preload="auto">
    <source src="clicksoundeffect.mp3" type="audio/mpeg">
  </audio>
  <audio id="hbMusic" preload="auto">
    <source src="hb128.mp3" type="audio/mpeg">
  </audio>

  <script>
    const bgMusic = document.getElementById('bgMusic');
    const clickSound = document.getElementById('clickSound');
    const hbMusic = document.getElementById('hbMusic');

    function playClick() {
      clickSound.currentTime = 0;
      clickSound.play().catch(() => {});
    }

    // Inicia música no primeiro clique (política do navegador)
    let musicStarted = false;
    document.addEventListener('click', function startMusic() {
      if (!musicStarted) {
        bgMusic.volume = 0.35;
        bgMusic.play().catch(() => {});
        musicStarted = true;
        document.removeEventListener('click', startMusic);
      }
    });

    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', playClick);
    });

    document.getElementById('openBtn').addEventListener('click', () => {
      document.getElementById('overlay').classList.add('active');
      // Pausa o bg e toca o happy birthday
      bgMusic.pause();
      hbMusic.currentTime = 0;
      hbMusic.volume = 0.8;
      hbMusic.play().catch(() => {});
      // Quando o hb terminar, retoma o bg
      hbMusic.onended = () => {
        bgMusic.play().catch(() => {});
      };
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      document.getElementById('overlay').classList.remove('active');
      hbMusic.pause();
      hbMusic.currentTime = 0;
      bgMusic.play().catch(() => {});
    });

    document.getElementById('overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('overlay')) {
        document.getElementById('overlay').classList.remove('active');
        hbMusic.pause();
        hbMusic.currentTime = 0;
        bgMusic.play().catch(() => {});
      }
    });

    document.getElementById('ticketThumb').addEventListener('click', () => {
      playClick();
      document.getElementById('lightbox').classList.add('active');
    });
    document.getElementById('lightbox').addEventListener('click', () => {
      playClick();
      document.getElementById('lightbox').classList.remove('active');
    });
  </script>
</body>
</html>
